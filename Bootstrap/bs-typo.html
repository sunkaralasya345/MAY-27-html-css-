<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Typo of BS </title>
     <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
</head>
<body>
    <div class="container">
        <h1><mark>This is mark text</mark></h1>
        <p><small>This is small text</small></p>
        <h2>Abbrevation of US</h2></br><abbr title="United States">US</abbr>
        <p>Normal Para</p>
        <div class="lead">
            <p>Lead class makes para standout</p>
        </div>

        <div class="text-left">
            <p>text-left class for left align</p>
        </div>

        <div class="text-right">
            <p>text-right class for right align</p>
        </div>

        <div class="text-center">
            <p>text-center class for left center</p>
        </div>

        <div class="text-uppercase">
            <p>text-uppercase</p>
        </div>

        <div class="text-nowrap">
            <p>BS no wrap class(text-nowrap)</p>
        </div>

        <div class="text-lowercase">
            <p>text-lowercase class</p>
        </div>

    </div>
</body>
</html>
